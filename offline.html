<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin conexion - UmbrellaApp</title>
<meta name="theme-color" content="#0f1012">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #0f1012; color: #e8eaed; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 8px 0 0; font-size: 18px; font-weight: 600; }
  p { margin: 0; color: #9aa0a6; font-size: 14px; max-width: 320px; }
  button { margin-top: 12px; height: 28px; padding: 0 16px; border-radius: 6px; font-size: 13px; font-weight: 500; background: #7c74ff linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0)); color: #fff; border: 1px solid #5f56f0; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="assets/icons/icon-192.png" alt="">
  <h1>Sin conexion</h1>
  <p>No se pudo contactar al servidor. Revisa tu conexion e intenta de nuevo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
<script>
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
