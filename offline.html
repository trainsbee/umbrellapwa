<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin conexion - UmbrellaApp</title>
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #1C1C1C; color: #EBEBEB; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 88px; height: 88px; }
  h1 { margin: 8px 0 0; font-size: 1.4rem; }
  p { margin: 0; opacity: .7; max-width: 320px; }
  button { margin-top: 12px; padding: 12px 22px; border: 0; border-radius: 12px; background: #7C5CFC; color: #fff; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="assets/icons/icon-192.png" alt="">
  <h1>Sin conexion</h1>
  <p>No se pudo contactar al servidor. Revisa tu conexion e intenta de nuevo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
<script>
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
