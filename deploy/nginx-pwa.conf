# UmbrellaApp PWA - nginx equivalent of the repo's .htaccess.

# Force HTTPS (the PWA and the service worker only work over HTTPS).
# Let's Encrypt validation still works: it follows the redirect.
if ($scheme = http) {
    return 301 https://$host$request_uri;
}

# Internal folders and repo files that are never served
location ~ ^/(includes|tools|deploy|\.git)(/|$) { return 404; }
location ~ (^|/)\.(gitignore|editorconfig|htaccess)$ { return 404; }
location ~ \.(md|sql|log|zip|sh)$ { return 404; }

# Service worker: never cache it, so updates arrive instantly
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires off;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Security headers for everything else
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
