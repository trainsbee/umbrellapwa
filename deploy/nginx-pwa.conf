# UmbrellaApp PWA - equivalente nginx del .htaccess del repo.

# Forzar HTTPS (la PWA y el service worker solo funcionan con HTTPS).
# La validacion de Let's Encrypt sigue funcionando: acepta la redireccion.
if ($scheme = http) {
    return 301 https://$host$request_uri;
}

# Carpetas internas y archivos del repo que no se sirven
location ~ ^/(includes|tools|deploy|\.git)(/|$) { return 404; }
location ~ (^|/)\.(gitignore|editorconfig|htaccess)$ { return 404; }
location ~ \.(md|sql|log|zip|sh)$ { return 404; }

# Service worker: nunca cachear, para que las actualizaciones lleguen al instante
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires off;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /offline.html {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Cabeceras de seguridad para el resto
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
